<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Falas Cruzadas</title>
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    color-scheme: dark;
    --bg: #131019;
    --bg-elevated: #1b1724;
    --bg-hover: #221d2e;
    --border: rgba(238, 232, 255, 0.09);
    --text-primary: #ece7f6;
    --text-secondary: #948ea8;
    --text-faint: #6c6680;
    --focus: rgba(164, 112, 226, 0.7);

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Lora", Georgia, "Times New Roman", serif;
    --font-ui:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(
      ellipse 900px 500px at 50% -10%,
      rgba(164, 112, 226, 0.07),
      transparent
    );
    color: var(--text-primary);
  }

  .page {
    margin: 0 auto;
    padding: 28px 0 64px;
    font-family: var(--font-ui);
  }

  .inset {
    padding-left: 14px;
    padding-right: 14px;
  }

  a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .topo {
    text-align: center;
    margin-bottom: 22px;
  }

  .topo h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .sub {
    color: var(--text-secondary);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--text-faint);
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .tema {
    font-family: var(--font-body);
    font-style: italic;
    color: var(--text-secondary);
    margin: 0 auto 10px;
    max-width: 60ch;
    line-height: 1.5;
  }

  .vazio {
    text-align: center;
    color: var(--text-secondary);
  }

  /* lista de dialogos e personagens */
  .indice {
    max-width: 820px;
    margin: 0 auto;
  }

  .elenco {
    margin-bottom: 30px;
  }

  .elenco-topo {
    margin-bottom: 10px;
  }

  .elenco-topo h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.05rem;
    margin: 0 0 6px;
  }

  .vozes {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .vozes li {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .vozes li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgb(var(--c));
  }

  .vozes a {
    color: inherit;
    text-decoration: none;
  }

  .vozes a:hover {
    color: var(--text-primary);
  }

  .lista {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
  }

  .item:hover {
    background: var(--bg-hover);
  }

  .item-titulo {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.35;
  }

  .item-nome {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .item-nome::before {
    content: "";
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgb(var(--c));
  }

  .item-tema {
    font-family: var(--font-body);
    font-style: italic;
    color: var(--text-secondary);
    font-size: 0.92rem;
    line-height: 1.45;
  }

  .item-tema.resumo {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .item-meta {
    color: var(--text-faint);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  /* leitura de um dialogo */
  .voltar {
    margin-bottom: 18px;
  }

  .voltar a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.85rem;
  }

  .voltar a:hover {
    color: var(--text-primary);
  }

  .dialogue {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .msg {
    animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    background: rgba(var(--accent), 0.26);
    border-top: 1px solid rgba(var(--accent), 0.4);
    border-bottom: 1px solid rgba(var(--accent), 0.4);
    border-left: 4px solid rgb(var(--accent));
    padding: 10px 14px;
  }

  .narration {
    animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    text-align: center;
    font-style: italic;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--text-faint);
    padding: 6px 14px;
  }

  @keyframes rise {
    from {
      transform: translateY(6px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg,
    .narration {
      animation: none;
    }
  }

  .name {
    color: rgb(var(--accent));
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 4px;
  }

  .name a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted rgba(var(--accent), 0.6);
  }

  .name a:hover {
    border-bottom-style: solid;
  }

  .text {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.55;
    color: var(--text-primary);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* ficha de personagem */
  .ficha {
    max-width: 760px;
    margin: 0 auto;
  }

  .ficha-cartao {
    background: rgba(var(--accent), 0.12);
    border-top: 1px solid rgba(var(--accent), 0.3);
    border-bottom: 1px solid rgba(var(--accent), 0.3);
    border-left: 4px solid rgb(var(--accent));
    padding: 16px 16px 6px;
  }

  .meta {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 16px;
    margin: 0 0 20px;
  }

  .meta dt {
    color: rgb(var(--accent));
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding-top: 4px;
  }

  .meta dd {
    margin: 0;
    font-family: var(--font-body);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .corpo p {
    font-family: var(--font-body);
    font-size: 1.02rem;
    line-height: 1.6;
    margin: 0 0 12px;
    overflow-wrap: anywhere;
  }

  .corpo h3 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.1rem;
    margin: 24px 0 8px;
  }

  .corpo blockquote {
    margin: 12px 0;
    padding: 2px 0 2px 12px;
    border-left: 2px solid rgba(var(--accent), 0.55);
    font-style: italic;
  }

  .corpo blockquote p {
    margin: 0 0 6px;
  }

  .corpo ul,
  .corpo ol {
    margin: 0 0 12px;
    padding-left: 22px;
    font-family: var(--font-body);
    line-height: 1.55;
  }

  .corpo li {
    margin-bottom: 4px;
  }

  .corpo hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 18px 0;
  }

  .aparece {
    margin-top: 28px;
  }

  .aparece h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.05rem;
    margin: 0 0 10px;
  }

  /* cofre: tela de chave da pagina cifrada */
  .cofre-form {
    max-width: 360px;
    margin: 24px auto 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cofre-rotulo {
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .cofre-campo {
    font: inherit;
    font-size: 1rem;
    width: 100%;
    padding: 12px;
    color: var(--text-primary);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .cofre-campo:focus-visible,
  .cofre-botao:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .cofre-lembrar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .cofre-botao {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 12px;
    color: var(--bg);
    background: var(--text-primary);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  .cofre-botao:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .cofre-aviso {
    min-height: 1.2em;
    margin: 0;
    font-size: 0.85rem;
    color: #f0a3a3;
  }

  @media (max-width: 480px) {
    .page {
      padding: 20px 0 48px;
    }
    .text {
      font-size: 1.05rem;
    }
    .meta {
      grid-template-columns: 1fr;
      gap: 2px;
    }
    .meta dd {
      margin-bottom: 10px;
    }
  }
</style>

  let BIBLIOTECA = null;
  let FICHAS = [];
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const COR_NEUTRA = "148,142,168";
  const app = document.getElementById("app");

  function el(tag, classe, texto) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function formatarData(iso) {
    const [a, m, d] = iso.split("-").map(Number);
    return d + " " + MESES[m - 1] + " " + a;
  }

  function plural(n, um, varios) {
    return n + " " + (n === 1 ? um : varios);
  }

  function elencoTitulo(slug) {
    const e = BIBLIOTECA.elencos[slug];
    return e ? e.titulo : slug;
  }

  function corDe(slugElenco, autor) {
    const elenco = BIBLIOTECA.elencos[slugElenco];
    return (elenco && elenco.cores && elenco.cores[autor]) || COR_NEUTRA;
  }

  function ehNarracao(autor) {
    const k = autor.trim().toLowerCase();
    return k === "narração" || k === "narracao";
  }

  function fichaPorNome(nome) {
    return FICHAS.find((f) => f.nome === nome);
  }

  function corDaFicha(ficha) {
    for (const slug of ficha.elencos) {
      const cor = corDe(slug, ficha.nome);
      if (cor !== COR_NEUTRA) return cor;
    }
    return COR_NEUTRA;
  }

  function dialogosDe(ficha) {
    return BIBLIOTECA.dialogos.filter((d) => d.falas.some((f) => f.autor === ficha.nome));
  }

  function resumoDe(ficha) {
    const campo = ficha.meta.find((m) => m[0] === "Papel" || m[0] === "Arquétipo") || ficha.meta[0];
    return campo ? campo[1] : "";
  }

  function linkFicha(ficha) {
    return "#p=" + encodeURIComponent(ficha.id);
  }

  function linkDialogo(d) {
    return "#d=" + encodeURIComponent(d.id);
  }

  /* markdown minimo das fichas: titulos, **negrito**, citacoes, listas e linha */
  function inline(pai, texto) {
    texto.split(/(\*\*[^*]+\*\*)/).forEach((parte) => {
      if (!parte) return;
      if (/^\*\*[^*]+\*\*$/.test(parte)) pai.append(el("strong", null, parte.slice(2, -2)));
      else pai.append(document.createTextNode(parte));
    });
  }

  const MARCA_UL = /^[-*]\s+/;
  const MARCA_OL = /^\d+\.\s+/;
  const FIM_DE_PARAGRAFO = /^(#{2,6}\s|>|-{3,}\s*$|[-*]\s|\d+\.\s)/;

  function markdown(texto) {
    const raiz = document.createDocumentFragment();
    const linhas = texto.split("\n");
    let i = 0;
    while (i < linhas.length) {
      const linha = linhas[i];
      if (!linha.trim()) {
        i++;
        continue;
      }
      if (/^-{3,}\s*$/.test(linha)) {
        raiz.append(el("hr"));
        i++;
        continue;
      }
      const titulo = /^#{2,6}\s+(.*)$/.exec(linha);
      if (titulo) {
        const h = el("h3");
        inline(h, titulo[1]);
        raiz.append(h);
        i++;
        continue;
      }
      if (/^>\s?/.test(linha)) {
        const partes = [];
        while (i < linhas.length && /^>\s?/.test(linhas[i])) {
          partes.push(linhas[i].replace(/^>\s?/, ""));
          i++;
        }
        const citacao = el("blockquote");
        const p = el("p");
        inline(p, partes.join(" ").trim());
        citacao.append(p);
        raiz.append(citacao);
        continue;
      }
      const marca = MARCA_UL.test(linha) ? MARCA_UL : MARCA_OL.test(linha) ? MARCA_OL : null;
      if (marca) {
        const lista = el(marca === MARCA_UL ? "ul" : "ol");
        while (i < linhas.length && marca.test(linhas[i])) {
          let texto = linhas[i].replace(marca, "");
          i++;
          while (i < linhas.length && /^\s+\S/.test(linhas[i])) {
            texto += " " + linhas[i].trim();
            i++;
          }
          const li = el("li");
          inline(li, texto);
          lista.append(li);
        }
        raiz.append(lista);
        continue;
      }
      const p = el("p");
      let primeira = true;
      while (i < linhas.length && linhas[i].trim() && !FIM_DE_PARAGRAFO.test(linhas[i])) {
        if (!primeira) p.append(document.createTextNode(" "));
        inline(p, linhas[i].trim());
        if (/ {2,}$/.test(linhas[i])) p.append(el("br"));
        primeira = false;
        i++;
      }
      raiz.append(p);
    }
    return raiz;
  }

  function mostrarIndice() {
    document.title = "Falas Cruzadas";
    app.replaceChildren();

    const dialogos = BIBLIOTECA.dialogos;
    const totalFalas = dialogos.reduce((soma, d) => soma + d.falas.length, 0);
    const raiz = el("div", "indice");

    const resumo = [plural(dialogos.length, "diálogo", "diálogos"), totalFalas + " falas"];
    if (FICHAS.length) resumo.push(plural(FICHAS.length, "personagem", "personagens"));
    const topo = el("header", "topo inset");
    topo.append(el("h1", null, "Falas Cruzadas"), el("p", "sub", resumo.join(" · ")));
    raiz.append(topo);

    if (!dialogos.length) {
      raiz.append(el("p", "vazio inset", "Nenhum diálogo salvo ainda."));
    }

    const grupos = new Map();
    for (const d of dialogos) {
      if (!grupos.has(d.elenco)) grupos.set(d.elenco, []);
      grupos.get(d.elenco).push(d);
    }

    for (const [slug, lista] of grupos) {
      const elenco = BIBLIOTECA.elencos[slug] || { titulo: slug, cores: {} };
      const secao = el("section", "elenco");

      const cab = el("div", "elenco-topo inset");
      cab.append(el("h2", null, elenco.titulo));
      const vozes = el("ul", "vozes");
      for (const nome of Object.keys(elenco.cores || {})) {
        const li = el("li");
        li.style.setProperty("--c", elenco.cores[nome]);
        const ficha = fichaPorNome(nome);
        if (ficha) {
          const a = el("a", null, nome);
          a.href = linkFicha(ficha);
          li.append(a);
        } else {
          li.textContent = nome;
        }
        vozes.append(li);
      }
      cab.append(vozes);
      secao.append(cab);

      const ul = el("ul", "lista");
      for (const d of lista) {
        const li = el("li");
        const a = el("a", "item");
        a.href = linkDialogo(d);
        a.append(el("span", "item-titulo", d.titulo));
        if (d.tema) a.append(el("span", "item-tema", d.tema));
        a.append(el("span", "item-meta", plural(d.falas.length, "fala", "falas") + " · " + formatarData(d.data)));
        li.append(a);
        ul.append(li);
      }
      secao.append(ul);
      raiz.append(secao);
    }

    if (FICHAS.length) {
      const secao = el("section", "elenco");
      const cab = el("div", "elenco-topo inset");
      cab.append(el("h2", null, "Personagens"));
      secao.append(cab);

      const ul = el("ul", "lista");
      for (const ficha of FICHAS) {
        const li = el("li");
        const a = el("a", "item");
        a.href = linkFicha(ficha);
        const nome = el("span", "item-titulo item-nome", ficha.nome);
        nome.style.setProperty("--c", corDaFicha(ficha));
        a.append(nome);
        const resumoFicha = resumoDe(ficha);
        if (resumoFicha) a.append(el("span", "item-tema resumo", resumoFicha));
        a.append(
          el(
            "span",
            "item-meta",
            plural(dialogosDe(ficha).length, "diálogo", "diálogos") + " · " + ficha.elencos.map(elencoTitulo).join(" · ")
          )
        );
        li.append(a);
        ul.append(li);
      }
      secao.append(ul);
      raiz.append(secao);
    }

    app.append(raiz);
  }

  function mostrarDialogo(d) {
    document.title = d.titulo + " · Falas Cruzadas";
    app.replaceChildren();

    const nav = el("nav", "voltar inset");
    const volta = el("a", null, "← Falas Cruzadas");
    volta.href = "#";
    nav.append(volta);

    const topo = el("header", "topo inset");
    topo.append(el("p", "eyebrow", elencoTitulo(d.elenco)), el("h1", null, d.titulo));
    if (d.tema) topo.append(el("p", "tema", d.tema));
    topo.append(el("p", "sub", plural(d.falas.length, "fala", "falas") + " · " + formatarData(d.data)));

    const corpo = el("main", "dialogue");
    d.falas.forEach((f, i) => {
      const autor = String(f.autor || "").trim();
      const texto = String(f.fala || "").trim();
      const caixa = el("div");
      caixa.style.animationDelay = Math.min(i, 10) * 30 + "ms";
      if (ehNarracao(autor)) {
        caixa.className = "narration";
        caixa.textContent = texto;
      } else {
        caixa.className = "msg";
        caixa.style.setProperty("--accent", corDe(d.elenco, autor));
        const nome = el("div", "name");
        const ficha = fichaPorNome(autor);
        if (ficha) {
          const a = el("a", null, autor);
          a.href = linkFicha(ficha);
          nome.append(a);
        } else {
          nome.textContent = autor || "Desconhecido";
        }
        caixa.append(nome, el("div", "text", texto));
      }
      corpo.append(caixa);
    });

    app.append(nav, topo, corpo);
  }

  function mostrarFicha(ficha) {
    document.title = ficha.nome + " · Falas Cruzadas";
    app.replaceChildren();

    const nav = el("nav", "voltar inset");
    const volta = el("a", null, "← Falas Cruzadas");
    volta.href = "#";
    nav.append(volta);

    const topo = el("header", "topo inset");
    topo.append(
      el("p", "eyebrow", "Ficha · " + ficha.elencos.map(elencoTitulo).join(" · ")),
      el("h1", null, ficha.nome)
    );

    const raiz = el("div", "ficha");
    const cartao = el("div", "ficha-cartao");
    cartao.style.setProperty("--accent", corDaFicha(ficha));

    if (ficha.meta.length) {
      const dl = el("dl", "meta");
      for (const [chave, valor] of ficha.meta) {
        const dd = el("dd");
        inline(dd, valor);
        dl.append(el("dt", null, chave), dd);
      }
      cartao.append(dl);
    }

    const corpo = el("div", "corpo");
    corpo.append(markdown(ficha.texto));
    cartao.append(corpo);
    raiz.append(cartao);

    const aparece = dialogosDe(ficha);
    if (aparece.length) {
      const secao = el("section", "aparece");
      secao.append(el("h2", "inset", "Aparece em"));
      const ul = el("ul", "lista");
      for (const d of aparece) {
        const li = el("li");
        const a = el("a", "item");
        a.href = linkDialogo(d);
        a.append(el("span", "item-titulo", d.titulo));
        const dela = d.falas.filter((f) => f.autor === ficha.nome).length;
        a.append(el("span", "item-meta", plural(dela, "fala", "falas") + " de " + d.falas.length));
        li.append(a);
        ul.append(li);
      }
      secao.append(ul);
      raiz.append(secao);
    }

    app.append(nav, topo, raiz);
  }

  function parametros() {
    return new URLSearchParams(location.hash.replace(/^#/, ""));
  }

  function rotear() {
    const p = parametros();
    const dialogo = BIBLIOTECA.dialogos.find((x) => x.id === p.get("d"));
    const ficha = FICHAS.find((x) => x.id === p.get("p"));
    if (dialogo) mostrarDialogo(dialogo);
    else if (ficha) mostrarFicha(ficha);
    else mostrarIndice();
    window.scrollTo(0, 0);
  }

  function iniciar(dados) {
    BIBLIOTECA = dados;
    FICHAS = dados.fichas || [];
    window.addEventListener("hashchange", rotear);
    rotear();
  }

  /* pagina cifrada: AES-256-GCM, chave derivada do token por PBKDF2 (Web Crypto) */
  const CHAVE_LOCAL = "falas-cruzadas-token";

  function bytes(base64) {
    return Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  }

  async function decifrar(token) {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, [
      "deriveKey",
    ]);
    const chave = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(PACOTE.salt), iterations: PACOTE.it, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(PACOTE.iv) }, chave, bytes(PACOTE.ct));
    return JSON.parse(new TextDecoder().decode(claro));
  }

  function lerLocal() {
    try {
      return localStorage.getItem(CHAVE_LOCAL) || "";
    } catch (e) {
      return "";
    }
  }

  function gravarLocal(token) {
    try {
      localStorage.setItem(CHAVE_LOCAL, token);
    } catch (e) {
      /* sem armazenamento local: so nao lembra */
    }
  }

  function limparLocal() {
    try {
      localStorage.removeItem(CHAVE_LOCAL);
    } catch (e) {
      /* nada a limpar */
    }
  }

  async function tentar(token, lembrar) {
    const dados = await decifrar(token);
    if (lembrar) gravarLocal(token);
    iniciar(dados);
  }

  function mostrarCofre(mensagem) {
    document.title = "Falas Cruzadas";
    app.replaceChildren();

    const raiz = el("div", "cofre");
    const topo = el("header", "topo inset");
    topo.append(el("h1", null, "Falas Cruzadas"), el("p", "sub", "Conteúdo protegido"));

    const form = el("form", "cofre-form inset");
    const rotulo = el("label", "cofre-rotulo", "Chave de acesso");
    const campo = el("input", "cofre-campo");
    campo.id = "chave";
    campo.type = "password";
    campo.autocomplete = "current-password";
    campo.autocapitalize = "none";
    campo.spellcheck = false;
    campo.required = true;
    rotulo.htmlFor = "chave";

    const lembrar = el("label", "cofre-lembrar");
    const caixa = el("input");
    caixa.type = "checkbox";
    caixa.checked = true;
    lembrar.append(caixa, document.createTextNode("Lembrar neste aparelho"));

    const botao = el("button", "cofre-botao", "Abrir");
    botao.type = "submit";
    const aviso = el("p", "cofre-aviso", mensagem || "");
    aviso.setAttribute("role", "alert");

    form.append(rotulo, campo, lembrar, botao, aviso);
    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      botao.disabled = true;
      botao.textContent = "Abrindo...";
      try {
        await tentar(campo.value.trim(), caixa.checked);
      } catch (e) {
        botao.disabled = false;
        botao.textContent = "Abrir";
        aviso.textContent = "Chave incorreta.";
        campo.select();
      }
    });

    raiz.append(topo, form);
    app.append(raiz);
    campo.focus();
  }

  async function abrir() {
    if (DADOS_ABERTOS) {
      iniciar(DADOS_ABERTOS);
      return;
    }
    if (!PACOTE) return;
    if (!(window.crypto && crypto.subtle)) {
      mostrarCofre("Este navegador não consegue abrir o conteúdo. Use uma conexão segura (https).");
      return;
    }

    app.replaceChildren(el("p", "vazio inset", "Abrindo..."));

    const p = parametros();
    const doLink = p.get("t");
    if (doLink) {
      p.delete("t");
      const resto = p.toString();
      try {
        history.replaceState(null, "", location.pathname + location.search + (resto ? "#" + resto : ""));
      } catch (e) {
        /* sem history API: o token continua visivel na barra */
      }
      try {
        await tentar(doLink, true);
      } catch (e) {
        mostrarCofre("A chave do link não funcionou.");
      }
      return;
    }

    const salvo = lerLocal();
    if (salvo) {
      try {
        await tentar(salvo, true);
        return;
      } catch (e) {
        limparLocal();
      }
    }
    mostrarCofre();
  }

  abrir();
</script>
