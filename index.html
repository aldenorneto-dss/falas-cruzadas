<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>De Camarote</title>
<!-- app instalavel (PWA): arquivos em pagina_app/, copiados pelo `biblioteca.py publicar` -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#131019" />
<link rel="icon" type="image/png" href="icones/favicon-32.png" />
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Camarote" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    color-scheme: dark;
    --bg: #131019;
    --bg-elevated: #1b1724;
    --bg-hover: #221d2e;
    --border: rgba(238, 232, 255, 0.09);
    --text-primary: #ece7f6;
    --text-secondary: #948ea8;
    --text-faint: #6c6680;
    --focus: rgba(164, 112, 226, 0.7);

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Lora", Georgia, "Times New Roman", serif;
    --font-ui:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(
      ellipse 900px 500px at 50% -10%,
      rgba(164, 112, 226, 0.07),
      transparent
    );
    color: var(--text-primary);
  }

  .page {
    margin: 0 auto;
    padding: 28px 0 64px;
    font-family: var(--font-ui);
  }

  .inset {
    padding-left: 14px;
    padding-right: 14px;
  }

  a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .topo {
    text-align: center;
    margin-bottom: 22px;
  }

  .topo h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .sub {
    color: var(--text-secondary);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--text-faint);
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .tema {
    font-family: var(--font-body);
    font-style: italic;
    color: var(--text-secondary);
    margin: 0 auto 10px;
    max-width: 60ch;
    line-height: 1.5;
  }

  /* descricao longa: abre recolhida em 3 linhas; tocar alterna entre completa e recolhida */
  .tema.recolhivel {
    cursor: pointer;
    border-radius: 6px;
  }
  .tema.recolhivel:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 4px;
  }
  .tema.recolhido {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .vazio {
    text-align: center;
    color: var(--text-secondary);
  }

  /* lista de dialogos e personagens */
  .indice {
    max-width: 820px;
    margin: 0 auto;
  }

  .elenco {
    margin-bottom: 30px;
  }

  .elenco-topo {
    margin-bottom: 10px;
  }

  .elenco-topo h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.05rem;
    margin: 0 0 6px;
  }

  .vozes {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 0.72rem;
  }

  /* tag com a cor do personagem; o texto (claro ou escuro) vem de corDoTexto() */
  .vozes li {
    padding: 2px 9px;
    border-radius: 999px;
    background: rgb(var(--c));
    color: var(--c-texto);
    font-weight: 600;
    line-height: 1.5;
  }

  .vozes a {
    color: inherit;
    text-decoration: none;
  }

  .vozes a:hover {
    color: var(--text-primary);
  }

  .lista {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
  }

  .item:hover {
    background: var(--bg-hover);
  }

  .item-titulo {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.35;
  }

  /* na aba de personagens o nome e a propria etiqueta, como nas tags das conversas */
  .item-nome {
    align-self: flex-start;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgb(var(--c));
    color: var(--c-texto);
    font-size: 0.98rem;
  }

  /* rodape para alternar entre as abas; so aparece nas listas, nao dentro de conversa/ficha */
  .abas {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    display: flex;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .abas[hidden] {
    display: none;
  }

  .abas a {
    flex: 1;
    padding: 14px 0 15px;
    text-align: center;
    color: var(--text-secondary);
    text-decoration: none;
    font-family: var(--font-ui);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .abas a[aria-current="page"] {
    color: var(--text-primary);
    box-shadow: inset 0 2px 0 rgba(164, 112, 226, 0.9);
  }

  body.com-abas {
    padding-bottom: calc(56px + env(safe-area-inset-bottom));
  }

  body.com-abas .instalar {
    bottom: calc(68px + env(safe-area-inset-bottom));
  }

  .item-tema {
    font-family: var(--font-body);
    font-style: italic;
    color: var(--text-secondary);
    font-size: 0.92rem;
    line-height: 1.45;
    /* na lista, no maximo 3 linhas com reticencias; a descricao inteira fica no dialogo */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .item-tema.resumo {
    -webkit-line-clamp: 2;
  }

  .item-meta {
    color: var(--text-faint);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  /* leitura de um dialogo */
  .voltar {
    margin-bottom: 18px;
  }

  .voltar a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.85rem;
  }

  .voltar a:hover {
    color: var(--text-primary);
  }

  .dialogue {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .msg {
    animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    background: rgba(var(--accent), 0.26);
    border-top: 1px solid rgba(var(--accent), 0.4);
    border-bottom: 1px solid rgba(var(--accent), 0.4);
    border-left: 4px solid rgb(var(--accent));
    padding: 10px 14px;
  }

  .narration {
    animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    text-align: center;
    font-style: italic;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--text-faint);
    padding: 6px 14px;
  }

  /* gesto (*empurra a taça*): acao do personagem, fora do balao */
  .gesto {
    animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    font-style: italic;
    font-size: 0.85rem;
    color: var(--text-secondary);
    padding: 4px 14px 4px 18px;
  }

  .gesto b {
    color: rgb(var(--accent));
    font-weight: 600;
  }

  @keyframes rise {
    from {
      transform: translateY(6px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg,
    .narration,
    .gesto {
      animation: none;
    }
  }

  .name {
    color: rgb(var(--accent));
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 4px;
  }

  .name a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted rgba(var(--accent), 0.6);
  }

  .name a:hover {
    border-bottom-style: solid;
  }

  .text {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.55;
    color: var(--text-primary);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* ficha de personagem */
  .ficha {
    max-width: 760px;
    margin: 0 auto;
  }

  .ficha-cartao {
    background: rgba(var(--accent), 0.12);
    border-top: 1px solid rgba(var(--accent), 0.3);
    border-bottom: 1px solid rgba(var(--accent), 0.3);
    border-left: 4px solid rgb(var(--accent));
    padding: 16px 16px 6px;
  }

  .meta {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 16px;
    margin: 0 0 20px;
  }

  .meta dt {
    color: rgb(var(--accent));
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding-top: 4px;
  }

  .meta dd {
    margin: 0;
    font-family: var(--font-body);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .corpo p {
    font-family: var(--font-body);
    font-size: 1.02rem;
    line-height: 1.6;
    margin: 0 0 12px;
    overflow-wrap: anywhere;
  }

  .corpo h3 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.1rem;
    margin: 24px 0 8px;
  }

  .corpo blockquote {
    margin: 12px 0;
    padding: 2px 0 2px 12px;
    border-left: 2px solid rgba(var(--accent), 0.55);
    font-style: italic;
  }

  .corpo blockquote p {
    margin: 0 0 6px;
  }

  .corpo ul,
  .corpo ol {
    margin: 0 0 12px;
    padding-left: 22px;
    font-family: var(--font-body);
    line-height: 1.55;
  }

  .corpo li {
    margin-bottom: 4px;
  }

  .corpo hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 18px 0;
  }

  .aparece {
    margin-top: 28px;
  }

  .aparece h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.05rem;
    margin: 0 0 10px;
  }

  /* cofre: tela de chave da pagina cifrada */
  .cofre-form {
    max-width: 360px;
    margin: 24px auto 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cofre-rotulo {
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .cofre-campo {
    font: inherit;
    font-size: 1rem;
    width: 100%;
    padding: 12px;
    color: var(--text-primary);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .cofre-campo:focus-visible,
  .cofre-botao:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .cofre-lembrar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .cofre-botao {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 12px;
    color: var(--bg);
    background: var(--text-primary);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  .cofre-botao:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .cofre-aviso {
    min-height: 1.2em;
    margin: 0;
    font-size: 0.85rem;
    color: #f0a3a3;
  }

  @media (max-width: 480px) {
    .page {
      padding: 20px 0 48px;
    }
    .text {
      font-size: 1.05rem;
    }
    .meta {
      grid-template-columns: 1fr;
      gap: 2px;
    }
    .meta dd {
      margin-bottom: 10px;
    }
  }

  /* convite para instalar o app (so aparece no navegador, nunca dentro do app) */
  .instalar {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 50;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    font-family: var(--font-ui);
    color: var(--text-primary);
  }
  .instalar[hidden] {
    display: none;
  }
  .instalar img {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    flex: none;
  }
  .instalar-texto {
    flex: 1;
    min-width: 0;
    font-size: 0.88rem;
    line-height: 1.35;
  }
  .instalar-texto strong {
    display: block;
    font-size: 0.95rem;
  }
  .instalar-texto span {
    color: var(--text-secondary);
  }
  .instalar button {
    font: inherit;
    font-size: 0.88rem;
    border: 0;
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
  }
  .instalar .instalar-sim {
    background: rgb(90, 197, 183);
    color: #10231f;
    font-weight: 600;
  }
  .instalar .instalar-nao {
    background: transparent;
    color: var(--text-secondary);
    padding: 9px 4px;
  }
</style>

<div class="instalar" id="instalar" hidden role="dialog" aria-label="Instalar o app">
  <img src="icones/icon-192.png" alt="" />
  <div class="instalar-texto">
    <strong>Instalar o De Camarote</strong>
    <span id="instalar-dica">Fica na tela inicial e abre como app.</span>
  </div>
  <button class="instalar-sim" id="instalar-sim" type="button">Instalar</button>
  <button class="instalar-nao" id="instalar-nao" type="button" aria-label="Agora não">✕</button>
</div>

<div class="page" id="app"></div>

  let BIBLIOTECA = null;
  let FICHAS = [];
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const COR_NEUTRA = "148,142,168";
  const app = document.getElementById("app");

  function el(tag, classe, texto) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function formatarData(iso) {
    const [a, m, d] = iso.split("-").map(Number);
    return d + " " + MESES[m - 1] + " " + a;
  }

  function plural(n, um, varios) {
    return n + " " + (n === 1 ? um : varios);
  }

  function elencoTitulo(slug) {
    const e = BIBLIOTECA.elencos[slug];
    return e ? e.titulo : slug;
  }

  function corDe(slugElenco, autor) {
    const elenco = BIBLIOTECA.elencos[slugElenco];
    return (elenco && elenco.cores && elenco.cores[autor]) || COR_NEUTRA;
  }

  function ehNarracao(autor) {
    const k = autor.trim().toLowerCase();
    return k === "narração" || k === "narracao";
  }

  // cabecalho do balao: apelido, com link para a ficha quando ela existe
  function nomeDoAutor(autor) {
    const nome = el("div", "name");
    const ficha = fichaPorNome(autor);
    if (ficha) {
      const a = el("a", null, exibir(autor));
      a.href = linkFicha(ficha);
      nome.append(a);
    } else {
      nome.textContent = autor ? exibir(autor) : "Desconhecido";
    }
    return nome;
  }

  // nome exibido: o apelido do index ("Otavio, o Inabalavel"); o nome real segue nas falas e nas fichas
  function exibir(nome) {
    return (BIBLIOTECA.apelidos || {})[nome] || nome;
  }

  function fichaPorNome(nome) {
    return FICHAS.find((f) => f.nome === nome);
  }

  // texto escuro ou claro, o que contrastar mais com o fundo "r,g,b" (luminancia relativa do WCAG)
  function corDoTexto(rgb) {
    const [r, g, b] = rgb.split(",").map((v) => {
      const c = Number(v) / 255;
      return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    });
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return (lum + 0.05) / 0.05 >= 1.05 / (lum + 0.05) ? "#131019" : "#ffffff";
  }

  function corDaFicha(ficha) {
    for (const slug of ficha.elencos) {
      const cor = corDe(slug, ficha.nome);
      if (cor !== COR_NEUTRA) return cor;
    }
    return COR_NEUTRA;
  }

  function dialogosDe(ficha) {
    return BIBLIOTECA.dialogos.filter((d) => d.falas.some((f) => f.autor === ficha.nome));
  }

  function resumoDe(ficha) {
    const campo = ficha.meta.find((m) => m[0] === "Papel" || m[0] === "Arquétipo") || ficha.meta[0];
    return campo ? campo[1] : "";
  }

  function linkFicha(ficha) {
    return "#p=" + encodeURIComponent(ficha.id);
  }

  function linkDialogo(d) {
    return "#d=" + encodeURIComponent(d.id);
  }

  /* markdown minimo das fichas: titulos, **negrito**, citacoes, listas e linha */
  function inline(pai, texto) {
    texto.split(/(\*\*[^*]+\*\*)/).forEach((parte) => {
      if (!parte) return;
      if (/^\*\*[^*]+\*\*$/.test(parte)) pai.append(el("strong", null, parte.slice(2, -2)));
      else pai.append(document.createTextNode(parte));
    });
  }

  const MARCA_UL = /^[-*]\s+/;
  const MARCA_OL = /^\d+\.\s+/;
  const FIM_DE_PARAGRAFO = /^(#{2,6}\s|>|-{3,}\s*$|[-*]\s|\d+\.\s)/;

  function markdown(texto) {
    const raiz = document.createDocumentFragment();
    const linhas = texto.split("\n");
    let i = 0;
    while (i < linhas.length) {
      const linha = linhas[i];
      if (!linha.trim()) {
        i++;
        continue;
      }
      if (/^-{3,}\s*$/.test(linha)) {
        raiz.append(el("hr"));
        i++;
        continue;
      }
      const titulo = /^#{2,6}\s+(.*)$/.exec(linha);
      if (titulo) {
        const h = el("h3");
        inline(h, titulo[1]);
        raiz.append(h);
        i++;
        continue;
      }
      if (/^>\s?/.test(linha)) {
        const partes = [];
        while (i < linhas.length && /^>\s?/.test(linhas[i])) {
          partes.push(linhas[i].replace(/^>\s?/, ""));
          i++;
        }
        const citacao = el("blockquote");
        const p = el("p");
        inline(p, partes.join(" ").trim());
        citacao.append(p);
        raiz.append(citacao);
        continue;
      }
      const marca = MARCA_UL.test(linha) ? MARCA_UL : MARCA_OL.test(linha) ? MARCA_OL : null;
      if (marca) {
        const lista = el(marca === MARCA_UL ? "ul" : "ol");
        while (i < linhas.length && marca.test(linhas[i])) {
          let texto = linhas[i].replace(marca, "");
          i++;
          while (i < linhas.length && /^\s+\S/.test(linhas[i])) {
            texto += " " + linhas[i].trim();
            i++;
          }
          const li = el("li");
          inline(li, texto);
          lista.append(li);
        }
        raiz.append(lista);
        continue;
      }
      const p = el("p");
      let primeira = true;
      while (i < linhas.length && linhas[i].trim() && !FIM_DE_PARAGRAFO.test(linhas[i])) {
        if (!primeira) p.append(document.createTextNode(" "));
        inline(p, linhas[i].trim());
        if (/ {2,}$/.test(linhas[i])) p.append(el("br"));
        primeira = false;
        i++;
      }
      raiz.append(p);
    }
    return raiz;
  }

  function topoDasAbas(raiz) {
    const dialogos = BIBLIOTECA.dialogos;
    const totalFalas = dialogos.reduce((soma, d) => soma + d.falas.length, 0);
    const resumo = [plural(dialogos.length, "diálogo", "diálogos"), totalFalas + " falas"];
    if (FICHAS.length) resumo.push(plural(FICHAS.length, "personagem", "personagens"));
    const topo = el("header", "topo inset");
    topo.append(el("h1", null, "De Camarote"), el("p", "sub", resumo.join(" · ")));
    raiz.append(topo);
  }

  function mostrarConversas() {
    document.title = "De Camarote";
    app.replaceChildren();

    const dialogos = BIBLIOTECA.dialogos;
    const raiz = el("div", "indice");
    topoDasAbas(raiz);

    if (!dialogos.length) {
      raiz.append(el("p", "vazio inset", "Nenhum diálogo salvo ainda."));
    }

    // lista unica: cada cartao mostra quem participa, sem cabecalho por elenco
    const secao = el("section", "elenco");
    const ul = el("ul", "lista");
    for (const d of dialogos) {
      const cores = (BIBLIOTECA.elencos[d.elenco] || {}).cores || {};
      const li = el("li");
      const a = el("a", "item");
      a.href = linkDialogo(d);
      a.append(el("span", "item-titulo", d.titulo));
      const vozes = el("ul", "vozes");
      // ordem fixa do elenco (a de cores no index), nao a de quem falou primeiro
      const falaram = new Set(d.falas.map((f) => f.autor).filter((autor) => !ehNarracao(autor)));
      const ordem = [...Object.keys(cores).filter((nome) => falaram.has(nome)), ...falaram];
      for (const nome of new Set(ordem)) {
        const voz = el("li", null, exibir(nome));
        const cor = cores[nome] || "160,160,160";
        voz.style.setProperty("--c", cor);
        voz.style.setProperty("--c-texto", corDoTexto(cor));
        vozes.append(voz);
      }
      a.append(vozes);
      if (d.tema) a.append(el("span", "item-tema", d.tema));
      a.append(el("span", "item-meta", plural(d.falas.length, "fala", "falas") + " · " + formatarData(d.data)));
      li.append(a);
      ul.append(li);
    }
    secao.append(ul);
    raiz.append(secao);
    app.append(raiz);
  }

  function mostrarPersonagens() {
    document.title = "Personagens · De Camarote";
    app.replaceChildren();

    const raiz = el("div", "indice");
    topoDasAbas(raiz);
    if (!FICHAS.length) {
      raiz.append(el("p", "vazio inset", "Nenhuma ficha de personagem ainda."));
    } else {
      const secao = el("section", "elenco");
      const ul = el("ul", "lista");
      for (const ficha of FICHAS) {
        const li = el("li");
        const a = el("a", "item");
        a.href = linkFicha(ficha);
        const nome = el("span", "item-titulo item-nome", exibir(ficha.nome));
        const cor = corDaFicha(ficha);
        nome.style.setProperty("--c", cor);
        nome.style.setProperty("--c-texto", corDoTexto(cor));
        a.append(nome);
        const resumoFicha = resumoDe(ficha);
        if (resumoFicha) a.append(el("span", "item-tema resumo", resumoFicha));
        a.append(
          el(
            "span",
            "item-meta",
            plural(dialogosDe(ficha).length, "diálogo", "diálogos") + " · " + ficha.elencos.map(elencoTitulo).join(" · ")
          )
        );
        li.append(a);
        ul.append(li);
      }
      secao.append(ul);
      raiz.append(secao);
    }

    app.append(raiz);
  }

  function mostrarDialogo(d) {
    document.title = d.titulo + " · De Camarote";
    app.replaceChildren();

    const nav = el("nav", "voltar inset");
    const volta = el("a", null, "← Conversas");
    volta.href = "#";
    nav.append(volta);

    const topo = el("header", "topo inset");
    topo.append(el("p", "eyebrow", elencoTitulo(d.elenco)), el("h1", null, d.titulo));
    const tema = d.tema ? el("p", "tema recolhido", d.tema) : null;
    if (tema) topo.append(tema);
    topo.append(el("p", "sub", plural(d.falas.length, "fala", "falas") + " · " + formatarData(d.data)));

    const corpo = el("main", "dialogue");
    d.falas.forEach((f, i) => {
      const autor = String(f.autor || "").trim();
      const texto = String(f.fala || "").trim();
      const atraso = Math.min(i, 10) * 30 + "ms";
      if (ehNarracao(autor)) {
        const caixa = el("div", "narration", texto);
        caixa.style.animationDelay = atraso;
        corpo.append(caixa);
        return;
      }
      // "*empurra a taça* prova esse": o trecho entre asteriscos (--gestos no motor) sai do
      // balao e vira uma linha de acao; o resto continua balao, com o nome so no primeiro.
      let primeiroBalao = true;
      texto.split(/\*([^*\n]+)\*/).forEach((parte, j) => {
        parte = parte.trim();
        if (!parte) return;
        let caixa;
        if (j % 2 === 1) {
          caixa = el("div", "gesto");
          caixa.append(el("b", null, (autor || "Alguém").split(" ")[0]), " " + parte);
        } else {
          caixa = el("div", "msg");
          if (primeiroBalao) caixa.append(nomeDoAutor(autor));
          primeiroBalao = false;
          caixa.append(el("div", "text", parte));
        }
        caixa.style.animationDelay = atraso;
        caixa.style.setProperty("--accent", corDe(d.elenco, autor));
        corpo.append(caixa);
      });
    });

    app.append(nav, topo, corpo);
    if (tema) tornarRecolhivel(tema);
  }

  // So vira "tocar para abrir" se o texto de fato passa das 3 linhas; curto fica como esta.
  function tornarRecolhivel(p) {
    if (p.scrollHeight <= p.clientHeight + 1) {
      p.classList.remove("recolhido");
      return;
    }
    p.classList.add("recolhivel");
    p.setAttribute("role", "button");
    p.tabIndex = 0;
    p.setAttribute("aria-expanded", "false");
    const alternar = () => {
      const recolhido = p.classList.toggle("recolhido");
      p.setAttribute("aria-expanded", String(!recolhido));
    };
    p.addEventListener("click", alternar);
    p.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        alternar();
      }
    });
  }

  function mostrarFicha(ficha) {
    document.title = exibir(ficha.nome) + " · De Camarote";
    app.replaceChildren();

    const nav = el("nav", "voltar inset");
    const volta = el("a", null, "← Personagens");
    volta.href = "#aba=personagens";
    nav.append(volta);

    const topo = el("header", "topo inset");
    topo.append(
      el("p", "eyebrow", "Ficha · " + ficha.elencos.map(elencoTitulo).join(" · ")),
      el("h1", null, exibir(ficha.nome))
    );

    const raiz = el("div", "ficha");
    const cartao = el("div", "ficha-cartao");
    cartao.style.setProperty("--accent", corDaFicha(ficha));

    if (ficha.meta.length) {
      const dl = el("dl", "meta");
      for (const [chave, valor] of ficha.meta) {
        const dd = el("dd");
        inline(dd, valor);
        dl.append(el("dt", null, chave), dd);
      }
      cartao.append(dl);
    }

    const corpo = el("div", "corpo");
    corpo.append(markdown(ficha.texto));
    cartao.append(corpo);
    raiz.append(cartao);

    const aparece = dialogosDe(ficha);
    if (aparece.length) {
      const secao = el("section", "aparece");
      secao.append(el("h2", "inset", "Aparece em"));
      const ul = el("ul", "lista");
      for (const d of aparece) {
        const li = el("li");
        const a = el("a", "item");
        a.href = linkDialogo(d);
        a.append(el("span", "item-titulo", d.titulo));
        const dela = d.falas.filter((f) => f.autor === ficha.nome).length;
        a.append(el("span", "item-meta", plural(dela, "fala", "falas") + " de " + d.falas.length));
        li.append(a);
        ul.append(li);
      }
      secao.append(ul);
      raiz.append(secao);
    }

    app.append(nav, topo, raiz);
  }

  function parametros() {
    return new URLSearchParams(location.hash.replace(/^#/, ""));
  }

  const abas = el("nav", "abas");
  abas.setAttribute("aria-label", "Abas");
  abas.hidden = true;
  const abaLinks = {
    conversas: Object.assign(el("a", null, "Conversas"), { href: "#" }),
    personagens: Object.assign(el("a", null, "Personagens"), { href: "#aba=personagens" }),
  };
  abas.append(abaLinks.conversas, abaLinks.personagens);
  document.body.append(abas);

  function marcarAba(aba) {
    abas.hidden = !aba;
    document.body.classList.toggle("com-abas", Boolean(aba));
    for (const [nome, link] of Object.entries(abaLinks)) {
      if (nome === aba) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    }
  }

  function rotear() {
    const p = parametros();
    const dialogo = BIBLIOTECA.dialogos.find((x) => x.id === p.get("d"));
    const ficha = FICHAS.find((x) => x.id === p.get("p"));
    if (dialogo) {
      mostrarDialogo(dialogo);
      marcarAba(null);
    } else if (ficha) {
      mostrarFicha(ficha);
      marcarAba(null);
    } else if (p.get("aba") === "personagens") {
      mostrarPersonagens();
      marcarAba("personagens");
    } else {
      mostrarConversas();
      marcarAba("conversas");
    }
    window.scrollTo(0, 0);
  }

  function iniciar(dados) {
    BIBLIOTECA = dados;
    FICHAS = dados.fichas || [];
    window.addEventListener("hashchange", rotear);
    rotear();
  }

  /* pagina cifrada: AES-256-GCM, chave derivada do token por PBKDF2 (Web Crypto) */
  const CHAVE_LOCAL = "falas-cruzadas-token";

  function bytes(base64) {
    return Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  }

  async function decifrar(token) {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, [
      "deriveKey",
    ]);
    const chave = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(PACOTE.salt), iterations: PACOTE.it, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(PACOTE.iv) }, chave, bytes(PACOTE.ct));
    return JSON.parse(new TextDecoder().decode(claro));
  }

  function lerLocal() {
    try {
      return localStorage.getItem(CHAVE_LOCAL) || "";
    } catch (e) {
      return "";
    }
  }

  function gravarLocal(token) {
    try {
      localStorage.setItem(CHAVE_LOCAL, token);
    } catch (e) {
      /* sem armazenamento local: so nao lembra */
    }
  }

  function limparLocal() {
    try {
      localStorage.removeItem(CHAVE_LOCAL);
    } catch (e) {
      /* nada a limpar */
    }
  }

  async function tentar(token, lembrar) {
    const dados = await decifrar(token);
    if (lembrar) gravarLocal(token);
    iniciar(dados);
  }

  function mostrarCofre(mensagem) {
    document.title = "De Camarote";
    app.replaceChildren();

    const raiz = el("div", "cofre");
    const topo = el("header", "topo inset");
    topo.append(el("h1", null, "De Camarote"), el("p", "sub", "Conteúdo protegido"));

    const form = el("form", "cofre-form inset");
    const rotulo = el("label", "cofre-rotulo", "Chave de acesso");
    const campo = el("input", "cofre-campo");
    campo.id = "chave";
    campo.type = "password";
    campo.autocomplete = "current-password";
    campo.autocapitalize = "none";
    campo.spellcheck = false;
    campo.required = true;
    rotulo.htmlFor = "chave";

    const lembrar = el("label", "cofre-lembrar");
    const caixa = el("input");
    caixa.type = "checkbox";
    caixa.checked = true;
    lembrar.append(caixa, document.createTextNode("Lembrar neste aparelho"));

    const botao = el("button", "cofre-botao", "Abrir");
    botao.type = "submit";
    const aviso = el("p", "cofre-aviso", mensagem || "");
    aviso.setAttribute("role", "alert");

    form.append(rotulo, campo, lembrar, botao, aviso);
    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      botao.disabled = true;
      botao.textContent = "Abrindo...";
      try {
        await tentar(campo.value.trim(), caixa.checked);
      } catch (e) {
        botao.disabled = false;
        botao.textContent = "Abrir";
        aviso.textContent = "Chave incorreta.";
        campo.select();
      }
    });

    raiz.append(topo, form);
    app.append(raiz);
    campo.focus();
  }

  async function abrir() {
    if (DADOS_ABERTOS) {
      iniciar(DADOS_ABERTOS);
      return;
    }
    if (!PACOTE) return;
    if (!(window.crypto && crypto.subtle)) {
      mostrarCofre("Este navegador não consegue abrir o conteúdo. Use uma conexão segura (https).");
      return;
    }

    app.replaceChildren(el("p", "vazio inset", "Abrindo..."));

    const p = parametros();
    const doLink = p.get("t");
    if (doLink) {
      p.delete("t");
      const resto = p.toString();
      try {
        history.replaceState(null, "", location.pathname + location.search + (resto ? "#" + resto : ""));
      } catch (e) {
        /* sem history API: o token continua visivel na barra */
      }
      try {
        await tentar(doLink, true);
      } catch (e) {
        mostrarCofre("A chave do link não funcionou.");
      }
      return;
    }

    const salvo = lerLocal();
    if (salvo) {
      try {
        await tentar(salvo, true);
        return;
      } catch (e) {
        limparLocal();
      }
    }
    mostrarCofre();
  }

  abrir();

  // ---- app instalavel (PWA) ----
  // So na pagina publicada (http/https): aberta como arquivo local nao ha manifesto nem SW.
  (function () {
    if (!/^https?:$/.test(location.protocol)) return;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }

    const jaInstalado =
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    if (jaInstalado) return;

    const ADIADO = "falas-instalar-adiado";
    const DIAS = 3;
    function adiadoRecente() {
      try {
        return Date.now() - Number(localStorage.getItem(ADIADO) || 0) < DIAS * 864e5;
      } catch (e) {
        return false;
      }
    }
    function adiar() {
      try {
        localStorage.setItem(ADIADO, String(Date.now()));
      } catch (e) {
        /* sem armazenamento: o convite volta na proxima visita */
      }
    }

    const caixa = document.getElementById("instalar");
    const sim = document.getElementById("instalar-sim");
    const dica = document.getElementById("instalar-dica");
    document.getElementById("instalar-nao").addEventListener("click", function () {
      caixa.hidden = true;
      adiar();
    });

    // Android/Chrome/Edge: o navegador entrega o pedido de instalacao e a gente mostra o convite.
    let pedido = null;
    window.addEventListener("beforeinstallprompt", function (ev) {
      ev.preventDefault();
      pedido = ev;
      if (!adiadoRecente()) caixa.hidden = false;
    });
    sim.addEventListener("click", async function () {
      if (!pedido) return;
      caixa.hidden = true;
      pedido.prompt();
      const escolha = await pedido.userChoice.catch(function () {
        return {};
      });
      if (escolha.outcome !== "accepted") adiar();
      pedido = null;
    });
    window.addEventListener("appinstalled", function () {
      caixa.hidden = true;
    });

    // iPhone/iPad: o Safari nao tem pedido automatico, entao o convite explica o caminho.
    const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (ehIOS && !adiadoRecente()) {
      dica.textContent = "Toque em Compartilhar (□↑) e depois em “Adicionar à Tela de Início”.";
      sim.hidden = true;
      caixa.hidden = false;
    }
  })();
</script>
</html>
